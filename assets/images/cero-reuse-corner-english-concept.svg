 <path d="M765 289L1181 283" stroke="#92ba80" stroke-width="5" opacity=".65"/>
 <!-- beams -->
 <path d="M790 353L790 673M1154 345L1154 665" stroke="#264e4d" stroke-width="18"/>
 <path d="M815 463L1138 460M815 574L1138 570" stroke="#875c39" stroke-width="19"/>
