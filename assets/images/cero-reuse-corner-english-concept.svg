<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">CERO and the reuse corner – English concept illustration</title>
<desc id="desc">Original illustration inspired by waste collection and electronics reuse: a collection centre and a reuse kiosk. This is not a photograph or architectural representation of the actual CERO in Stara Gora, Nova Gorica.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#79bee8"/><stop offset="1" stop-color="#e8f5ed"/></linearGradient>
 <linearGradient id="pavement" x2=".1" y2="1"><stop stop-color="#bcc4bc"/><stop offset="1" stop-color="#7f999b"/></linearGradient>
 <linearGradient id="wall" x2=".96" y2="1"><stop stop-color="#fffdf0"/><stop offset="1" stop-color="#dce8cf"/></linearGradient>
 <linearGradient id="awning" x2="0" y2="1"><stop stop-color="#1b7262"/><stop offset="1" stop-color="#145347"/></linearGradient>
 <linearGradient id="wood" x2="0" y2="1"><stop stop-color="#f4d49f"/><stop offset="1" stop-color="#bb8e5d"/></linearGradient>
 <linearGradient id="bin" x2="0" y2="1"><stop stop-color="#426874"/><stop offset="1" stop-color="#213a48"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#1e4c50" flood-opacity=".23"/></filter>
 <pattern id="pavers" width="85" height="65" patternUnits="userSpaceOnUse"><path d="M0 64H85M0 0V65" fill="none" stroke="#82989a" stroke-width="2" opacity=".2"/></pattern>
</defs>
<rect width="1200" height="800" fill="url(#sky)"/>
<path d="M0 335Q165 275 320 325T675 299T1200 320V800H0Z" fill="#97c5a0"/>
<path d="M0 415Q225 360 420 402T1200 382V800H0Z" fill="#66a18a"/>
<!-- trees and greenery -->
<g fill="#41896b"><circle cx="42" cy="155" r="116"/><circle cx="134" cy="76" r="91"/><circle cx="210" cy="138" r="98"/><circle cx="1148" cy="85" r="104"/><circle cx="1086" cy="133" r="75"/></g>
<g fill="#72af70" opacity=".85"><circle cx="82" cy="42" r="103"/><circle cx="198" cy="74" r="64"/><circle cx="1200" cy="23" r="85"/></g>
<!-- road -->
<path d="M0 528L756 448L1200 481V800H0Z" fill="url(#pavement)"/>
<path d="M0 528L756 448L1200 481V800H0Z" fill="url(#pavers)"/>
<path d="M0 664L1200 576" stroke="#e8efdd" stroke-width="5" opacity=".65"/>
<!-- main building -->
<g filter="url(#shadow)">
 <path d="M36 238L590 210L739 270L715 552L36 580Z" fill="url(#wall)" stroke="#9aaca3" stroke-width="3"/>
 <path d="M35 238L575 211L744 261L192 291Z" fill="#315d5d"/>
 <path d="M44 253L563 225L719 264L209 291Z" fill="#6cbc55"/>
 <path d="M44 253L209 291L209 572L44 581Z" fill="#e9eddf"/>
 <path d="M189 302L722 269L710 552L189 574Z" fill="#ecf1e8"/>
