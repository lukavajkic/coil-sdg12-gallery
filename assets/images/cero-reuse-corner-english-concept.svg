<!-- E-WASTE BIN -->
<g filter="url(#shadow)">
 <path d="M675 487L762 474L789 650L688 662Z" fill="url(#bin)" stroke="#28404b" stroke-width="5"/>
 <path d="M674 484L752 461L778 475L697 504Z" fill="#375d65"/>
 <path d="M697 518L756 510" stroke="#9caeac" stroke-width="10" stroke-linecap="round"/>
 <rect x="707" y="542" width="44" height="53" rx="5" fill="#233a43" stroke="#d5e2dc" stroke-width="3"/>
 <path d="M723 553v35m9-35v35m8-35v35M718 550h25" stroke="#b8d6cd" stroke-width="4" stroke-linecap="round"/>
 <text x="693" y="619" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#fff" letter-spacing="1">E-WASTE</text>
</g>
<!-- collection centre foreground sign -->
<g filter="url(#shadow)">
 <path d="M73 454V735M385 439V733" stroke="#526e6e" stroke-width="14"/>
 <path d="M42 459L388 438L402 628L53 660Z" fill="#184e45" stroke="#d2e9bd" stroke-width="7"/>
 <text x="214" y="522" text-anchor="middle" fill="white" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="800" letter-spacing="1">COLLECTION</text>
 <text x="214" y="560" text-anchor="middle" fill="white" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" letter-spacing="1">CENTRE</text>
 <path d="M102 606H350m-29-27l29 27-29 27" fill="none" stroke="#e6f4e6" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<!-- booth text on the dark green awning -->
<g font-family="Arial,Helvetica,sans-serif" fill="#fff" text-anchor="middle">
 <text x="968" y="314" font-size="32" font-weight="800" letter-spacing="1">REUSE CORNER</text>
 <text x="970" y="338" font-size="14" font-weight="600" letter-spacing=".8">GIVE ELECTRONICS A SECOND LIFE</text>
</g>
<!-- clear image attribution: concept, not actual venue photo -->
<rect x="776" y="727" width="405" height="48" rx="8" fill="#103c48" fill-opacity=".95"/>
<text x="979" y="748" text-anchor="middle" font-size="15" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-weight="800" letter-spacing="1">CONCEPT ILLUSTRATION</text>
<text x="979" y="765" text-anchor="middle" font-size="12" fill="#bfe4db" font-family="Arial,Helvetica,sans-serif">Not a photograph of the actual CERO site</text>
</svg>