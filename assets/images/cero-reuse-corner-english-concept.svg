 <path d="M397 324L687 308L676 526L399 540Z" fill="#273f47"/>
 <path d="M395 329L685 313" stroke="#a7c5b8" stroke-width="8"/>
 <path d="M531 322L528 533" stroke="#738f92" stroke-width="6"/>
</g>
<!-- building sign -->
<g font-family="Arial,Helvetica,sans-serif" fill="#1f464a">
 <text x="80" y="369" font-size="75" font-weight="800" letter-spacing="1">CERO</text>
 <text x="84" y="405" font-size="25" font-weight="700">Stara Gora</text>
 <text x="84" y="436" font-size="25" font-weight="700">Nova Gorica</text>
</g>
<g fill="none" stroke="#54a45b" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" transform="translate(112 465) scale(.81)">
 <path d="M0 38L30 -13L63 40"/><path d="M25 -14H46L62 11"/><path d="M63 40H5"/><path d="M55 36L64 51L77 31"/>
</g>
