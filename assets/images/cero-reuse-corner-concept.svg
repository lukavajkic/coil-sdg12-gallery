<g transform="translate(1137 528)"><path d="M-15 2L-4 73H38L49 2Z" fill="#597b6f"/><path d="M17 2Q-9-38 10-65M17 2Q31-43 43-49M17-14Q-13-24-24-40" fill="none" stroke="#347a55" stroke-width="6"/><g fill="#45985f"><ellipse cx="-9" cy="-40" rx="18" ry="10" transform="rotate(25 -9 -40)"/><ellipse cx="42" cy="-49" rx="19" ry="10" transform="rotate(-33 42 -49)"/><ellipse cx="-17" cy="-19" rx="16" ry="9" transform="rotate(13 -17 -19)"/><ellipse cx="35" cy="-16" rx="17" ry="10" transform="rotate(-25 35 -16)"/><ellipse cx="6" cy="-67" rx="12" ry="21" transform="rotate(-25 6 -67)"/></g></g>
