<g fill="#407f61"><ellipse cx="51" cy="405" rx="46" ry="80"/><ellipse cx="112" cy="430" rx="37" ry="72"/><ellipse cx="1122" cy="394" rx="54" ry="92"/><ellipse cx="1178" cy="405" rx="52" ry="96"/></g>
<g fill="#4c9065" opacity=".9"><circle cx="45" cy="377" r="45"/><circle cx="100" cy="398" r="45"/><circle cx="1116" cy="353" r="52"/><circle cx="1180" cy="362" r="51"/></g>
