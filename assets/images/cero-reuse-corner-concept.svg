<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">Illustration of CERO collection centre and an electronics reuse corner</title>
<desc id="desc">Original illustrative scene inspired by the idea of a collection centre in Stara Gora near Nova Gorica, showing e-waste containers and a small reuse corner with second-hand electronics. This does not depict the actual building or facility.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#83ccef"/><stop offset="1" stop-color="#e6f4ec"/></linearGradient>
 <linearGradient id="grass" x2="0" y2="1"><stop stop-color="#75b66a"/><stop offset="1" stop-color="#3d8b62"/></linearGradient>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#f2ecdf"/><stop offset="1" stop-color="#d8dcd5"/></linearGradient>
 <linearGradient id="wood" x2="1" y2="1"><stop stop-color="#ebc68d"/><stop offset="1" stop-color="#c08f57"/></linearGradient>
 <linearGradient id="roof" x2="1" y2="1"><stop stop-color="#275365"/><stop offset="1" stop-color="#172e3b"/></linearGradient>
 <linearGradient id="road" x2="0" y2="1"><stop stop-color="#c5d3d0"/><stop offset="1" stop-color="#829a9a"/></linearGradient>
 <filter id="shadow" x="-25%" y="-30%" width="150%" height="165%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#25414b" flood-opacity=".22"/></filter>
 <pattern id="grain" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#fff" stroke-opacity=".075"/></pattern>
</defs>
